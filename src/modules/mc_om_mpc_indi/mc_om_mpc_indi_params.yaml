module_name: mc_om_mpc_indi
parameters:
- group: Multicopter MPC
  definitions:
    MPC_ACCINDI_EN:
      description:
        short: Enable acceleration INDI middle layer
        long: |-
          Enables acceleration-INDI/lift corrections and matched disturbance
          estimation together. It accepts fresh
          onboard OmMpcCommand or external OmMpcSetpoint commands and publishes
          a disturbance estimate when MPC_DFB_EN and matched measurements permit.
          Parameter enable and RC10 middle/high (normalized value >= 0) use
          OR logic. With neither request, it bypasses onboard corrections and
          preserves nominal external command forwarding; it does not provide
          valid disturbance feedback. RC requires a valid signal younger than 500 ms.
          Onboard corrections return through mc_att_control's single output
          arbitration. Other controllers keep their existing paths.
      type: boolean
      default: 0
    MPC_DFB_EN:
      description:
        short: Enable OM disturbance feedback to MPC
        long: |-
          Publishes valid matched acceleration-disturbance estimates to onboard
          or ROS MPC. Parameter enable and RC10 high (normalized value >= 0.5)
          use OR logic. With neither request, prediction feedback is disabled
          without disabling acceleration INDI. Onboard MPC scales the estimate with MPC_DFB_GAIN;
          ROS MPC uses its own gain. Stale or unmatched measurements remain invalid.
          RC requires a valid signal younger than 500 ms. The middle layer must
          also be enabled before feedback can be valid.
      type: boolean
      default: 1
    MPC_ACCINDI_HZ:
      description:
        short: Acceleration INDI maximum update rate
        long: |-
          Maximum acceleration-INDI correction update rate. New attitude messages
          trigger updates subject to this minimum spacing; this is not a fixed-rate
          timer. Acceleration feedback is held between its own samples. Onboard
          final rate publication remains owned by mc_att_control. With acceleration
          INDI disabled, each new external OmMpcSetpoint is forwarded once.
      type: float
      default: 250.0
      min: 50.0
      max: 500.0
      unit: Hz
      decimal: 1
    MPC_ACCINDI_SRC:
      description:
        short: Acceleration INDI feedback source
        long: |-
          EKF acceleration is the NED linear acceleration from
          VehicleLocalPosition. IMU acceleration is bias-corrected body-FRD
          specific force from VehicleAcceleration, rotated to NED at its sample
          time with gravity restored. Velocity differentiation is unsupported.
      type: enum
      values:
        1: EKF acceleration
        2: IMU acceleration
      default: 1
    MPC_ACCINDI_LPF:
      description:
        short: Acceleration INDI feedback low-pass cutoff
        long: |-
          Second-order low-pass applied independently at each acceleration
          source's real sample rate and to raw allocated force after rotation
          to NED. Filtering the body-force magnitude before rotation does not
          preserve the matched inertial acceleration/thrust expansion point.
      type: float
      default: 8.0
      min: 0.0
      max: 50.0
      unit: Hz
      decimal: 1
      increment: 0.5
    MPC_DFB_LIM:
      description:
        short: MPC disturbance-feedback magnitude limit
        long: Euclidean magnitude limit applied to the direct matched disturbance estimate. Zero disables the limit and matches main.m.
      type: float
      default: 0.0
      min: 0.0
      max: 20.0
      unit: m/s^2
      decimal: 2
      increment: 0.1
    MPC_ACCINDI_FDLY:
      description:
        short: Acceleration INDI force-feedback delay
        long: Additional timestamp delay used to phase-align allocator force and acceleration.
      type: float
      default: 0.0
      min: 0.0
      max: 0.1
      unit: s
      decimal: 3
      increment: 0.005
    MPC_ACCINDI_TR_T:
      description:
        short: Acceleration INDI transition time
        long: Smoothstep transition from the nominal MPC command to the corrected command. Zero disables the transition and matches main.m.
      type: float
      default: 0.0
      min: 0.0
      max: 5.0
      unit: s
      decimal: 2
      increment: 0.1
    MPC_ACCINDI_K_R:
      description:
        short: Acceleration INDI roll correction gain
      type: float
      default: 0.5
      min: 0.0
      unit: 1/s
      decimal: 2
    MPC_ACCINDI_K_P:
      description:
        short: Acceleration INDI pitch correction gain
      type: float
      default: 0.5
      min: 0.0
      unit: 1/s
      decimal: 2
    MPC_ACCINDI_K_Y:
      description:
        short: Acceleration INDI yaw correction gain
      type: float
      default: 0.0
      min: 0.0
      unit: 1/s
      decimal: 2
