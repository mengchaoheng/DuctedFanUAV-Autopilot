module_name: FigureEight
parameters:
- group: Orbit - figure eight
  definitions:
    MC_HF8_AX:
      description:
        short: Horizontal figure-eight X amplitude
        long: Fundamental sin(theta) amplitude in the local shape frame; used when MC_ORBIT_SHAPE=1.
      type: float
      default: 5.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_HF8_AY:
      description:
        short: Horizontal figure-eight Y amplitude
        long: Second-harmonic sin(2 theta) amplitude in the local shape frame; used when MC_ORBIT_SHAPE=1.
      type: float
      default: 2.5
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_HF8_AZ:
      description:
        short: Horizontal figure-eight height amplitude
        long: Signed positive-up coefficient in h=h_entry+AZ*f(n*theta), selected by MC_HF8_Z_FUNC and MC_HF8_Z_N. Used when MC_ORBIT_SHAPE=1 with parameter geometry. Zero keeps constant altitude. For sin/cos the range is h_entry +/- abs(AZ); for 1-cos the endpoints are h_entry and h_entry+2*AZ. Geometry is latched at task entry.
      type: float
      default: 0.0
      unit: m
      min: -10000.0
      max: 10000.0
      increment: 0.1
      decimal: 2
    MC_HF8_Z_FUNC:
      description:
        short: Horizontal figure-eight height function
        long: Height function f(n*theta) used with MC_HF8_AZ. Applies only to parameterized horizontal figure eights. Latched at task entry; exit and re-enter to apply changes.
      type: enum
      values:
        0: sin(n*theta)
        1: cos(n*theta)
        2: 1-cos(n*theta)
      default: 0
    MC_HF8_Z_N:
      description:
        short: Horizontal figure-eight height harmonic
        long: Integer height cycles per full horizontal figure eight. Height angular frequency is n times MC_HF8_OMEGA at constant phase rate, subject to MC_F8_ACC. Latched at task entry. Default 2 preserves the original sin(2*theta) height reference.
      type: int32
      default: 2
      min: 1
      max: 10
      increment: 1
    MC_HF8_OMEGA:
      description:
        short: Horizontal figure-eight phase rate
        long: Signed phase rate used when MC_ORBIT_SHAPE=1. Zero holds the trajectory origin.
      type: float
      default: 0.4
      unit: rad/s
      min: -20.0
      max: 20.0
      increment: 0.1
      decimal: 2
    MC_F8_HDG:
      description:
        short: Figure-eight shape direction
        long: Direction of the horizontal major axis for both horizontal and vertical figure eights. Zero points North/X and positive angles rotate toward East/Y.
      type: float
      default: 0.0
      unit: deg
      min: -180.0
      max: 180.0
      increment: 5.0
      decimal: 1
    MC_F8_ACC:
      description:
        short: Figure-eight acceleration limit
        long: Maximum acceleration used to limit the phase rate of both horizontal and vertical figure eights.
      type: float
      default: 2.0
      unit: m/s^2
      min: 0.0
      max: 20.0
      increment: 0.5
      decimal: 1
    MC_VF8_AX:
      description:
        short: Vertical figure-eight X amplitude
        long: Horizontal fundamental amplitude in the local shape frame; used when MC_ORBIT_SHAPE=3.
      type: float
      default: 2.0
      unit: m
      min: 0.0
      max: 10000.0
    MC_VF8_AZ:
      description:
        short: Vertical figure-eight Z amplitude
        long: Vertical amplitude in local NED; used when MC_ORBIT_SHAPE=3. Uses sin(2 theta).
      type: float
      default: 2.0
      unit: m
      min: 0.0
      max: 10000.0
    MC_VF8_OMEGA:
      description:
        short: Vertical figure-eight phase rate
        long: Signed phase rate used when MC_ORBIT_SHAPE=3. Zero holds the trajectory origin.
      type: float
      default: 0.25
      unit: rad/s
      min: -20.0
      max: 20.0
