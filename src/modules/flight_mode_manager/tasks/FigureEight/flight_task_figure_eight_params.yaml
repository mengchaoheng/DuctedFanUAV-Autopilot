module_name: FigureEight
parameters:
- group: Flight Task Figure Eight
  definitions:
    MC_F8_VEL:
      description:
        short: Default figure-eight velocity
        long: Ground speed used when figure-eight mode is entered without a MAV_CMD_DO_ORBIT command.
      type: float
      default: 1.0
      unit: m/s
      min: 0.0
      max: 20.0
      increment: 0.1
      decimal: 1
    MC_F8_RAT:
      description:
        short: Figure-eight minor to major radius ratio
        long: Ratio between the lateral amplitude and the main amplitude of the figure-eight trajectory.
      type: float
      default: 0.5
      min: 0.1
      max: 1.0
      increment: 0.05
      decimal: 2
    MC_F8_HDG:
      description:
        short: Figure-eight heading offset
        long: Clockwise rotation of the initial trajectory tangent relative to the vehicle heading when the task is activated.
      type: float
      default: 0.0
      unit: deg
      min: -180.0
      max: 180.0
      increment: 5.0
      decimal: 1
    MC_F8_ACC:
      description:
        short: Maximum figure-eight feed-forward acceleration
        long: Maximum normal acceleration used to limit speed according to the local curvature of the reference trajectory.
      type: float
      default: 2.0
      unit: m/s^2
      min: 0.5
      max: 10.0
      increment: 0.5
      decimal: 1
