module_name: Orbit
parameters:
- group: Orbit - circle
  definitions:
    MC_HCIRC_AX:
      description:
        short: Horizontal circle X amplitude
        long: X semi-axis in local NED; used when MC_ORBIT_SHAPE=0. Altitude is constant.
      type: float
      default: 5.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_HCIRC_AY:
      description:
        short: Horizontal circle Y amplitude
        long: Y semi-axis in local NED; used when MC_ORBIT_SHAPE=0.
      type: float
      default: 5.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_HCIRC_OMEGA:
      description:
        short: Horizontal circle phase rate
        long: Signed phase rate used when MC_ORBIT_SHAPE=0. Zero holds the trajectory origin.
      type: float
      default: 0.2
      unit: rad/s
      min: -20.0
      max: 20.0
      increment: 0.1
      decimal: 2
    MC_CIRC_ACC:
      description:
        short: Circle acceleration limit
        long: Maximum acceleration used to limit the phase rate of both horizontal and vertical circles.
      type: float
      default: 2.0
      unit: m/s^2
      min: 0.0
      max: 20.0
      increment: 0.1
      decimal: 1
    MC_VCIRC_AX:
      description:
        short: Vertical circle X amplitude
        long: Horizontal fundamental amplitude in the local shape frame; used when MC_ORBIT_SHAPE=2.
      type: float
      default: 2.0
      unit: m
      min: 0.0
      max: 10000.0
    MC_VCIRC_AZ:
      description:
        short: Vertical circle Z amplitude
        long: Vertical amplitude in local NED; used when MC_ORBIT_SHAPE=2. Uses sin(theta).
      type: float
      default: 2.0
      unit: m
      min: 0.0
      max: 10000.0
    MC_VCIRC_OMEGA:
      description:
        short: Vertical circle phase rate
        long: Signed phase rate used when MC_ORBIT_SHAPE=2. Zero holds the trajectory origin.
      type: float
      default: 0.4
      unit: rad/s
      min: -20.0
      max: 20.0
