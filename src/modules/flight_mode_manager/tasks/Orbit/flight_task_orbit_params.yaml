module_name: Orbit
parameters:
- group: Flight Task Orbit
  definitions:
    MC_ORBIT_RAD_MAX:
      description:
        short: Maximum radius of orbit
      type: float
      default: 1000.0
      unit: m
      min: 1.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_ORBIT_VEL:
      description:
        short: Default orbit velocity
        long: Initial tangential ground speed when Orbit is activated. A finite MAV_CMD_DO_ORBIT velocity command overrides this value, and the pilot can subsequently adjust the speed with the sticks.
      type: float
      default: 1.0
      unit: m/s
      min: 0.0
      max: 20.0
      increment: 0.1
      decimal: 1
    MC_ORBIT_YAW_MOD:
      description:
        short: Yaw behaviour during orbit flight
      type: enum
      values:
        0: Front to Circle Center
        1: Hold Initial Heading
        2: Uncontrolled
        3: Hold Front Tangent to Circle
        4: Manually (yaw stick) Controlled
      default: 0
