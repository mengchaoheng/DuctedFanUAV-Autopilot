module_name: Orbit
parameters:
- group: Orbit - circle
  definitions:
    MC_CIRC_AX:
      description:
        short: Circle X amplitude
        long: X semi-axis of the parameterized harmonic orbit in local NED (m).
      type: float
      default: 5.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_CIRC_AY:
      description:
        short: Circle Y amplitude
        long: Y semi-axis of the parameterized harmonic orbit in local NED (m).
      type: float
      default: 5.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_CIRC_AZ:
      description:
        short: Circle Z amplitude
        long: Z amplitude of the parameterized harmonic orbit in local NED (m); zero keeps altitude constant.
      type: float
      default: 0.0
      unit: m
      min: 0.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_CIRC_OMEGA:
      description:
        short: Circle angular speed
        long: Signed phase rate in rad/s. Zero means hold the orbit origin.
      type: float
      default: 0.2
      unit: rad/s
      min: -20.0
      max: 20.0
      increment: 0.1
      decimal: 2
    MC_CIRC_ACC:
      description:
        short: Circle acceleration limit
        long: Maximum acceleration used to limit the configured angular speed.
      type: float
      default: 2.0
      unit: m/s^2
      min: 0.0
      max: 20.0
      increment: 0.1
      decimal: 1
