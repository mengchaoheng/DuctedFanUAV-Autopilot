module_name: flight_mode_manager
parameters:
- group: Orbit - control
  definitions:
    MC_ORBIT_EN:
      description:
        short: Enable parameter-triggered trajectory
        long: Enables the selected Orbit trajectory when MC_ORBIT_SRC is Parameter. Parameter and RC7 triggers are combined with OR logic.
      type: boolean
      default: 0
    MC_ORBIT_SRC:
      description:
        short: Trajectory trigger source
        long: Selects MAV_CMD_DO_ORBIT (0) or the parameter/RC7 trigger (1). This is a global trigger setting; geometry is selected by MC_ORBIT_SHAPE and configured in the corresponding shape group.
      type: enum
      values:
        0: MAVLink command
        1: Parameter or RC7
      default: 0
    MC_ORBIT_SHAPE:
      description:
        short: Multicopter orbit trajectory shape
        long: Selects the trajectory task when entering Orbit mode. The selection is latched until Orbit mode is exited.
      type: enum
      values:
        0: Horizontal Circle / Ellipse
        1: Horizontal Figure Eight
        2: Vertical Circle / Ellipse
        3: Vertical Figure Eight
      default: 0
    MC_ORBIT_YAW_MOD:
      description:
        short: Yaw mode during trajectory
        long: Global yaw behavior used by Circle and Figure Eight tasks unless a MAVLink orbit command supplies another behavior.
      type: enum
      values:
        0: Front to center
        1: Hold initial heading
        2: Uncontrolled
        3: Front tangent to path
        4: Manual yaw stick
      default: 0
    MC_ORBIT_RAD_MAX:
      description:
        short: Maximum trajectory semi-axis
        long: Safety limit applied to every trajectory shape. Shape-specific semi-axes are constrained to this value.
      type: float
      default: 1000.0
      unit: m
      min: 1.0
      max: 10000.0
      increment: 0.5
      decimal: 1
    MC_ORB_OM_END:
      description:
        short: Terminal harmonic phase rate
        long: Signed terminal phase rate for parameterized Orbit and FigureEight. Used only when MC_ORB_OM_TIME is positive. Changing the target or duration restarts the ramp from the current rate without moving its phase or center.
      type: float
      default: 0.0
      min: -20.0
      max: 20.0
      unit: rad/s
    MC_ORB_OM_TIME:
      description:
        short: Harmonic phase-rate ramp duration
        long: Linear speed-ramp duration after approach finishes. Zero preserves the selected horizontal or vertical trajectory phase rate. The terminal rate is held after this duration; references and prediction share the same finite schedule.
      type: float
      default: 0.0
      min: 0.0
      max: 120.0
      unit: s
