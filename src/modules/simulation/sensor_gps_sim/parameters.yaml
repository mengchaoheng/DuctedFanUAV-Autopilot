module_name: sensor_gps_sim
parameters:
- group: Sensors
  definitions:
    SENS_EN_GPSSIM:
      description:
        short: Enable simulated GPS sinstance
      type: enum
      values:
        0: Disabled
        1: Enabled
      default: 0
      reboot_required: true
      min: 0
      max: 1
- group: Simulator
  definitions:
    SIM_GPS_USED:
      description:
        short: simulated GPS number of satellites used
      type: int32
      default: 10
      min: 0
      max: 50
    SIM_GPS_P_XY:
      description:
        short: Horizontal position stationary noise standard deviation in metres.
      type: float
      default: 0.0028
      min: 0.0
      decimal: 6
    SIM_GPS_P_Z:
      description:
        short: Vertical position stationary noise standard deviation in metres.
      type: float
      default: 0.0056
      min: 0.0
      decimal: 6
    SIM_GPS_V_XY:
      description:
        short: Horizontal velocity stationary noise standard deviation in m/s.
      type: float
      default: 0.01265
      min: 0.0
      decimal: 6
    SIM_GPS_V_Z:
      description:
        short: Vertical velocity stationary noise standard deviation in m/s.
      type: float
      default: 0.0253
      min: 0.0
      decimal: 6
    SIM_GPS_P_T:
      description:
        short: Position noise correlation time in seconds. Zero generates independent samples.
      type: float
      default: 0.238
      min: 0.0
      decimal: 6
    SIM_GPS_V_T:
      description:
        short: Velocity noise correlation time in seconds. Zero generates independent samples.
      type: float
      default: 0.0
      min: 0.0
      decimal: 6
