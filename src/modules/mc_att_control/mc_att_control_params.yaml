module_name: mc_att_control
parameters:
- group: Multicopter Attitude Control
  definitions:
    MC_ROLL_P:
      description:
        short: Roll P gain
        long: Roll proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 4.0
      min: 0.0
      max: 12
      decimal: 2
      increment: 0.1
    MC_PITCH_P:
      description:
        short: Pitch P gain
        long: Pitch proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 4.0
      min: 0.0
      max: 12
      decimal: 2
      increment: 0.1
    MC_YAW_P:
      description:
        short: Yaw P gain
        long: Yaw proportional gain, i.e. desired angular speed in rad/s for error
          1 rad.
      type: float
      default: 2.8
      min: 0.0
      max: 5
      decimal: 2
      increment: 0.1
    MC_YAW_WEIGHT:
      description:
        short: Yaw weight
        long: |-
          A fraction [0,1] deprioritizing yaw compared to roll and pitch in non-linear attitude control.
          Deprioritizing yaw is necessary because multicopters have much less control authority
          in yaw compared to the other axes and it makes sense because yaw is not critical for
          stable hovering or 3D navigation.

          For yaw control tuning use MC_YAW_P. This ratio has no impact on the yaw gain.
      type: float
      default: 0.4
      min: 0.0
      max: 1.0
      decimal: 2
      increment: 0.1
    MC_ATT_ERR_MODE:
      description:
        short: Attitude error calculation mode
        long: |-
          Selects the attitude error vector used by the multicopter attitude controller.

          0: PX4 default reduced attitude with yaw weighting. This is the original PX4/Brescianini 2013 style implementation. It prioritizes roll and pitch by constructing a reduced desired attitude and then applying yaw weighting. Error scale: 2*n*sin(theta/2).

          1: Full quaternion imaginary-vector error. This uses qe = q^(-1) * qd and 2*imag(qe). Error scale: 2*n*sin(theta/2).

          2: Full quaternion logarithm-map error. This uses qe = q^(-1) * qd and converts qe to an axis-angle vector. Error scale: n*theta.

          3: Full DCM logarithm-map error. This uses Re = R^T * Rd and log(Re).vee(). Error scale: n*theta.

          4: Full DCM vee-map error. This uses 0.5*(R^T*Rd - Rd^T*R).vee(), corresponding to the Lee et al. geometric attitude error with PX4 body-rate sign convention. Error scale: n*sin(theta).

          5: Tal and Karaman incremental attitude command error. This constructs the incremental attitude command from the current attitude to the desired thrust direction and yaw reference. Error scale: n*theta.

          6: Tilt-prioritized quaternion error. This uses the Brescianini and D'Andrea / Sun et al. split into reduced-attitude and yaw errors, adapted to the PX4 convention qe = q^(-1) * qd. Error scale: 2*n*sin(theta/2).

          7: Tilt-torsion SO(3) logarithm-map error. This uses the Yu et al. tilt-torsion decomposition with Re = R^T * Rd, computes tilt and torsion errors separately, and applies yaw weighting to torsion. Error scale: n*theta.
      type: int32
      default: 0
      min: 0
      max: 7
      values:
        0: PX4 default reduced attitude with yaw weighting
        1: Full quaternion imaginary-vector error
        2: Full quaternion logarithm-map error
        3: Full DCM logarithm-map error
        4: Full DCM vee-map error
        5: Tal and Karaman incremental attitude command error
        6: Tilt-prioritized quaternion error
        7: Tilt-torsion SO(3) logarithm-map error
    MC_ROLLRATE_MAX:
      description:
        short: Max roll rate
        long: |-
          Limit for roll rate in manual and auto modes (except acro).
          Has effect for large rotations in autonomous mode, to avoid large control
          output and mixer saturation.

          This is not only limited by the vehicle's properties, but also by the maximum
          measurement rate of the gyro.
      type: float
      default: 220.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_PITCHRATE_MAX:
      description:
        short: Max pitch rate
        long: |-
          Limit for pitch rate in manual and auto modes (except acro).
          Has effect for large rotations in autonomous mode, to avoid large control
          output and mixer saturation.

          This is not only limited by the vehicle's properties, but also by the maximum
          measurement rate of the gyro.
      type: float
      default: 220.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
    MC_YAWRATE_MAX:
      description:
        short: Max yaw rate
      type: float
      default: 200.0
      unit: deg/s
      min: 0.0
      max: 1800.0
      decimal: 1
      increment: 5
- group: Multicopter Position Control
  definitions:
    MC_MAN_TILT_TAU:
      description:
        short: Manual tilt input filter time constant
        long: Setting this parameter to 0 disables the filter
      type: float
      default: 0.0
      unit: s
      min: 0.0
      max: 2.0
      decimal: 2
